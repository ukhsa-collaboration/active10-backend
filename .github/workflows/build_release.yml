name: "Build, Test and Release"

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  actions: read
  pull-requests: write

jobs:
  prepare-release-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Bump tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: bump
        uses: ukhsa-collaboration/devops-github-actions/.github/actions/github-bump-tag@52f31c5544ee5204dd0e169728c595b6a402205f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true

      - name: Export release tag
        id: export
        run: echo "release_tag=${{ steps.bump.outputs.new_tag }}" >> "$GITHUB_OUTPUT"

  container-image:
    name: Build, Test and Release
    needs: prepare-release-tag
    permissions:
      contents: write
      id-token: write
      actions: read
      pull-requests: write
    uses: ukhsa-collaboration/devops-application-cicd/.github/workflows/container-image-build-python-aws-ecs.yml@a36afd979decc84825f39498aa0fc9ffae7872be # v0.0.12
    with:
      app_name: ${{ vars.APP_NAME }}
      service_identifier: ${{ vars.ECR_NAMESPACE }}
      aws_region: ${{ vars.AWS_REGION }}
      run_unit_tests: ${{ vars.RUN_UNIT_TESTS == 'true' }}
      unit_test_command: sudo apt-get update && sudo apt-get -y install make && make unit-tests
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      release_tag: ${{ needs.prepare-release-tag.outputs.release_tag }}
      registry_account_id: "636728427214"
      aws_registry_role_name: "github-active-10-backend-ecr"
      lint_dockerfile: false
      deploy_environments: >-
        [
          { "name": "dev", "base_url": "https://dev.active10.betterhealthapps.com", "smoke_test_url": "https://dev.active10.betterhealthapps.com/healthcheck" },
          { "name": "uat", "base_url": "https://uat.active10.betterhealthapps.com", "smoke_test_url": "https://uat.active10.betterhealthapps.com/healthcheck" },
          { "name": "prd", "base_url": "https://prd.active10.betterhealthapps.com", "smoke_test_url": "https://prd.active10.betterhealthapps.com/healthcheck" }
        ]
    secrets: inherit
